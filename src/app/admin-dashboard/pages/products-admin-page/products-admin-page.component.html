<h1 class="text-2xl font-bold">Listado de productos</h1>
<h3 class="text-lg">
  Total de productos:
  <span class="text-accent">{{ productsResource.value()?.count ?? 0 }}</span>
</h3>
<div class="divider"></div>

<div class="flex justify-end mb-2">
  <button class="btn btn-primary">Nuevo producto</button>
</div>

<app-pagination
  [pages]="productsResource.value()?.pages ?? 0"
  [currentPage]="paginationService.currentPage()"
/>

<product-table [products]="productsResource.value()?.products ?? []" />
